[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "completion-review-plugin"
version = "0.1.2"
requires-python = ">=3.11"
description = "Explicit specification approval and bounded review plugin"
[project.scripts]
completion-review = "completion_plugin.cli:main"
[tool.setuptools.packages.find]
include = ["completion_plugin*"]
[project.optional-dependencies]
mcp = ["mcp>=1.29,<2"]
