[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "completion-qa-mcp"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = ["mcp==1.29.0"]
[project.scripts]
completion-qa-mcp = "completion_qa.server:main"
[tool.setuptools.packages.find]
include = ["completion_qa*"]
